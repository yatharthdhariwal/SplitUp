# -----------------------------------------------------------------------
# docker-compose.yml — Local development with Docker
# -----------------------------------------------------------------------
# Usage:
#   docker compose up --build    ← first time (builds the image)
#   docker compose up            ← subsequent runs
#   docker compose down          ← stop and remove containers
# -----------------------------------------------------------------------

version: '3.9'

services:

  # ─── Flask API (SQLite) ─────────────────────────────────────────────
  web:
    build: .                    # build from the Dockerfile in the current directory
    restart: unless-stopped
    environment:
      FLASK_ENV:          development
      SECRET_KEY:         ${SECRET_KEY:-dev-secret-change-in-production}
      JWT_SECRET_KEY:     ${JWT_SECRET_KEY:-dev-jwt-change-in-production}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-*}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-60}
    ports:
      # Map container port 8000 → host port 5000
      # Access the API at http://localhost:5000
      - "5000:8000"
    volumes:
      # Mount source code into the container for live reloading during development.
      # Changes to your code on the host are immediately reflected inside the container.
      - .:/app
      # Named volume to persist the SQLite database across container restarts
      - sqlite_data:/app/instance

# Named volume declaration — Docker manages this storage.
volumes:
  sqlite_data:
