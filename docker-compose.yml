# -----------------------------------------------------------------------
# docker-compose.yml — Local development with Docker
# -----------------------------------------------------------------------
# Usage:
#   docker compose up --build    ← first time (builds the image)
#   docker compose up            ← subsequent runs
#   docker compose down          ← stop and remove containers
#   docker compose down -v       ← also wipe the database volume
# -----------------------------------------------------------------------

version: '3.9'

services:

  # ─── PostgreSQL Database ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine   # alpine = smaller image
    restart: unless-stopped
    environment:
      POSTGRES_USER:     splitwise_user
      POSTGRES_PASSWORD: splitwise_pass
      POSTGRES_DB:       splitwise_db
    volumes:
      # Named volume: persists DB data between `docker compose down` restarts.
      # Without this, the database is wiped every time you stop the container.
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose to host so you can connect with a GUI tool like TablePlus/DBeaver
      - "5432:5432"
    healthcheck:
      # Docker will wait until PostgreSQL is actually ready before starting the web service.
      test: ["CMD-SHELL", "pg_isready -U splitwise_user -d splitwise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Flask API ─────────────────────────────────────────────────────────
  web:
    build: .                    # build from the Dockerfile in the current directory
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy  # wait for DB healthcheck to pass
    environment:
      FLASK_ENV:          development
      DATABASE_URL:       postgresql://splitwise_user:splitwise_pass@db:5432/splitwise_db
      SECRET_KEY:         ${SECRET_KEY:-dev-secret-change-in-production}
      JWT_SECRET_KEY:     ${JWT_SECRET_KEY:-dev-jwt-change-in-production}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-*}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-60}
    ports:
      # Map container port 8000 → host port 5000
      # Access the API at http://localhost:5000
      - "5000:8000"
    volumes:
      # Mount source code into the container for live reloading during development.
      # Changes to your code on the host are immediately reflected inside the container.
      - .:/app

# Named volume declaration — Docker manages this storage.
volumes:
  postgres_data:
