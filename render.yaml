# -----------------------------------------------------------------------
# render.yaml — Render Infrastructure-as-Code (Blueprint)
# -----------------------------------------------------------------------
# This file tells Render how to deploy your app automatically.
# When you connect this repo to Render, it reads this file and
# creates the web service + database for you.
#
# Docs: https://render.com/docs/blueprint-spec
# -----------------------------------------------------------------------

services:
  - type: web
    name: splitup-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT --timeout 120 run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: 60
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: splitup-db
          property: connectionURI
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: splitup-db
    plan: free
    region: oregon
    databaseName: splitup_db
    user: splitup_user
