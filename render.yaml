# -----------------------------------------------------------------------
# render.yaml — Render Infrastructure-as-Code (Blueprint)
# -----------------------------------------------------------------------
# This file tells Render how to deploy your app automatically.
# Uses SQLite (file-based) — no external database service needed.
#
# Docs: https://render.com/docs/blueprint-spec
# -----------------------------------------------------------------------

services:
  - type: web
    name: splitup-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT --timeout 120 run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: 60
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"

